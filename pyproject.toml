[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "dulwich==1.2.21",
    "mcp==2.3.0",
    "ok-script[ocr,qt]==3.0.7",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv6>=0.0.1",
    "openvino",
    "opencv-python",
    "playwright",
    "pyappify[standalone]>=1.0.20"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx>=0.28,<1",
]
cloud = [
    "playwright>=1.55,<2",
    "tzdata>=2025.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
